name: sc-vcell
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - pip:
    - torch>=2.2.0           # MPS backend for Apple Silicon (M3)
    - torchvision>=0.17.0
    - lightning>=2.2.0
    - scanpy>=1.10.0
    - anndata>=0.10.0
    - scvi-tools>=1.1.0
    - pertpy>=0.7.0          # data loaders + perturbation utilities
    - fair-esm               # ESM-2 protein embeddings (Day 4)
    - scgpt                  # scGPT model + fine-tuning (Day 2)
    - scprint                # scPRINT causal model (Day 3)
    - gears-perturbation     # GEARS graph model (Day 2)
    - umap-learn>=0.5
    - plotly>=5.0
    - jupyter
    - ipykernel
    - tqdm
    - pyyaml
    # cell-eval: install from Arc Institute GitHub — see scripts/download_checkpoints.sh
